name: zenphoto

services:

  db:
    image: mariadb:11.4
    restart: always
    env_file: env.txt
    volumes:
      - db:/var/lib/mysql:Z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    hostname: zenphoto
    ports:
      - "8000:80"
    volumes:
      - web:/var/www/html
    restart: always
    env_file: env.txt

volumes:
  db:
  web:
